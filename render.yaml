# Render Blueprint - LYZNART
# Klik: https://render.com/deploy?repo=https://github.com/NurainiLyzna/LYZNART-sistemkoordinatkartesius
# Render otomatis membuat web service + database PostgreSQL, tanpa isian manual.
services:
  - type: web
    name: lyznart
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lyznart-db
          property: connectionString

databases:
  - name: lyznart-db
    plan: free
    region: singapore
    databaseName: lyznart
    user: lyznart

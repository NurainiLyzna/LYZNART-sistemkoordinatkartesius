# Render Blueprint - LYZNART
# Render > New > Blueprint > pilih repository ini. Isi DATABASE_URL saat diminta.
services:
  - type: web
    name: lyznart
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # tempel connection string PostgreSQL (Neon) di dashboard Render
